services:
  v3:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ~/.trading-oracle/auth:/root/.trading-oracle/auth
  v4:
    build: .
    profiles: ["v4"]  # 이름을 지정해야만 켜진다. 맥북에서 v3와 함께 켜지면 같은 토스 키를 두 곳에서 쓰게 된다
    init: true
    restart: unless-stopped
    command: ["rt-trading", "v4-serve", "--host", "0.0.0.0"]
    ports:
      - 127.0.0.1:8081:8081
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ~/.trading-oracle/auth:/root/.trading-oracle/auth
  v5:
    build: .
    profiles: ["v5"]  # 이름을 지정해야만 켜진다. v4와 같은 포트·토스 키를 쓰므로 v4를 멈춘 뒤에 켠다
    init: true
    restart: unless-stopped
    command: ["rt-trading", "v5-serve", "--host", "0.0.0.0"]
    ports:
      - 127.0.0.1:8081:8081
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ~/.trading-oracle/auth:/root/.trading-oracle/auth
  v6:
    build: .
    profiles: ["v6"]  # 이름을 지정해야만 켜진다. 같은 ./data를 연결해 v5와 토스 토큰 파일 하나를 함께 쓴다
    init: true
    restart: unless-stopped
    command: ["rt-trading", "v6-serve", "--host", "0.0.0.0"]
    ports:
      - 127.0.0.1:8082:8082
    volumes:
      - ./data:/app/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ~/.trading-oracle/auth:/root/.trading-oracle/auth
